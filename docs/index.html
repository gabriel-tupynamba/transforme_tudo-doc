<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Transforme Tudo — uma plataforma para transformar corpo, mente e espírito através de ações práticas.">

    <meta name="theme-color" content="#0b0b0b">

    <title>Transforme Tudo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --background: #0a0a0a;
            --surface: #121212;
            --surface-hover: #1a1a1a;

            --gold: #d4af37;
            --gold-light: #f0d875;

            --text: #f5f5f5;
            --text-secondary: #a7a7a7;

            --border: rgba(212, 175, 55, 0.18);
        }

        body {
            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(212, 175, 55, 0.14),
                    transparent 38%
                ),
                radial-gradient(
                    circle at 100% 100%,
                    rgba(212, 175, 55, 0.06),
                    transparent 30%
                ),
                var(--background);

            display: flex;
            justify-content: center;

            padding: 48px 20px;
        }

        .container {
            width: 100%;
            max-width: 560px;

            text-align: center;
        }


        /* =========================
           LOGO COMPLETA
        ========================== */

        .logo-wrapper {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            margin: 0 auto 28px;

            /*
             * A logo possui formato horizontal.
             * Não usamos uma caixa quadrada para não
             * distorcer ou cortar a identidade visual.
             */
        }

        .logo {
            display: block;

            width: min(100%, 430px);

            height: auto;

            object-fit: contain;

            /*
             * Pequeno limite para impedir que a logo
             * fique exageradamente grande em telas maiores.
             */
            max-height: 190px;
        }


        /* =========================
           ACESSIBILIDADE / IDENTIDADE
        ========================== */

        .brand {
            position: absolute;

            width: 1px;
            height: 1px;

            padding: 0;
            margin: -1px;

            overflow: hidden;

            clip: rect(0, 0, 0, 0);

            white-space: nowrap;

            border: 0;
        }

        .tagline {
            color: var(--text-secondary);

            font-size: 16px;

            line-height: 1.7;

            max-width: 430px;

            margin: 0 auto 34px;
        }

        .tagline strong {
            color: #d6d6d6;
        }


        /* =========================
           PILARES
        ========================== */

        .pillars {
            display: flex;

            justify-content: center;

            gap: 8px;

            flex-wrap: wrap;

            margin-bottom: 34px;
        }

        .pillar {
            padding: 7px 13px;

            border-radius: 999px;

            background: rgba(255, 255, 255, 0.04);

            border: 1px solid rgba(255, 255, 255, 0.08);

            color: #cfcfcf;

            font-size: 12px;

            font-weight: 600;

            letter-spacing: 0.3px;
        }


        /* =========================
           BOTÕES
        ========================== */

        .buttons {
            display: flex;

            flex-direction: column;

            gap: 13px;
        }

        .button {
            min-height: 60px;

            width: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            padding: 16px 20px;

            border-radius: 15px;

            text-decoration: none;

            font-size: 16px;

            font-weight: 700;

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                background 0.18s ease;

            cursor: pointer;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .button:active {
            transform: scale(0.985);
        }

        .button-primary {
            color: #0b0b0b;

            background:
                linear-gradient(
                    135deg,
                    #f3d96b,
                    #c9a82e
                );

            box-shadow:
                0 10px 30px rgba(212, 175, 55, 0.16);
        }

        .button-primary:hover {
            box-shadow:
                0 14px 36px rgba(212, 175, 55, 0.25);
        }

        .button-secondary {
            color: var(--text);

            background: var(--surface);

            border: 1px solid var(--border);
        }

        .button-secondary:hover {
            background: var(--surface-hover);

            border-color:
                rgba(212, 175, 55, 0.35);
        }

        .button-icon {
            font-size: 19px;
        }


        /* =========================
           DOCUMENTOS
        ========================== */

        .legal {
            margin-top: 32px;

            padding-top: 25px;

            border-top:
                1px solid rgba(255, 255, 255, 0.07);

            display: flex;

            justify-content: center;

            gap: 22px;

            flex-wrap: wrap;
        }

        .legal a {
            color: #858585;

            font-size: 13px;

            text-decoration: none;

            transition:
                color 0.15s ease;
        }

        .legal a:hover {
            color: var(--gold-light);

            text-decoration: underline;
        }


        /* =========================
           RODAPÉ
        ========================== */

        footer {
            margin-top: 32px;

            color: #555555;

            font-size: 12px;

            line-height: 1.7;
        }


        /* =========================
           RESPONSIVO
        ========================== */

        @media (max-width: 480px) {

            body {
                padding:
                    34px 18px;
            }

            .logo-wrapper {
                margin-bottom: 24px;
            }

            .logo {
                width: min(100%, 350px);

                max-height: 150px;
            }

            .tagline {
                font-size: 15px;

                max-width: 360px;
            }

            .button {
                min-height: 57px;

                font-size: 15px;
            }
        }
    </style>
</head>


<body>

    <main class="container">

        <!-- =========================
             LOGO PRINCIPAL
        ========================== -->

        <div class="logo-wrapper">

            <img
                src="assets/logo.png"
                alt="Transforme Tudo — Corpo, Mente, Espírito"
                class="logo"
            >

        </div>


        <!--
            Mantemos o H1 para estrutura semântica e acessibilidade,
            mas ele não aparece visualmente porque a própria logo
            já contém o nome da marca.
        -->

        <h1 class="brand">
            Transforme Tudo
        </h1>


        <!-- =========================
             DESCRIÇÃO
        ========================== -->

        <p class="tagline">
            Um ecossistema para transformar
            <strong>corpo, mente e espírito</strong>
            através de ações práticas.
        </p>


        <!-- =========================
             PILARES
        ========================== -->

        <div class="pillars">

            <span class="pillar">
                Corpo
            </span>

            <span class="pillar">
                Mente
            </span>

            <span class="pillar">
                Espírito
            </span>

        </div>


        <!-- =========================
             ACESSOS PRINCIPAIS
        ========================== -->

        <div class="buttons">

            <a
                href="https://transformetudo.web.app"
                class="button button-primary"
            >
                <span class="button-icon">🌐</span>

                Acessar o Transforme Tudo
            </a>


            <a
                href="https://github.com/gabriel-tupynamba/transforme_tudo-doc/releases/download/v1.0.1/Transforme_Tudo_v1.0.1.apk"
                class="button button-secondary"
                download
            >
                <span class="button-icon">📱</span>

                Baixar aplicativo Android
            </a>

        </div>


        <!-- =========================
             DOCUMENTOS LEGAIS
        ========================== -->

        <div class="legal">

            <a href="privacidade/POLITICA_DE_PRIVACIDADE.html">
                Política de Privacidade
            </a>

            <a href="privacidade/TERMOS_DE_USO.html">
                Termos de Uso
            </a>

        </div>


        <!-- =========================
             RODAPÉ
        ========================== -->

        <footer>

            © 2026 Transforme Tudo.<br>

            Desenvolvido com rigor, propósito e engenharia.

        </footer>

    </main>

</body>

</html>
